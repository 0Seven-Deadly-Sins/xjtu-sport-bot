name: Verify CAS login (no attendance)

on:
  push:
    paths:
      - ".github/workflows/auth-check.yml"
      - "cas_auth.py"
      - "token_auth.py"
      - "session_cache.py"
      - "sport_bot.py"
      - "tests/**"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sport-bot
  cancel-in-progress: false

jobs:
  verify-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check authentication and operation guards
        run: python -m unittest discover -s tests -v
      - name: Decide whether a login is ready
        id: session
        env:
          EVENT_NAME: ${{ github.event_name }}
          SPORT_TOKEN: ${{ secrets.SPORT_TOKEN }}
          SPORT_BROWSER_STATE: ${{ secrets.SPORT_BROWSER_STATE }}
        run: |
          ready=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -n "$SPORT_BROWSER_STATE" ] || [ -n "$SPORT_TOKEN" ]; then
            ready=true
          else
            echo "Browser session is not configured. Unit tests passed; live login was skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
          status=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -n "$SPORT_BROWSER_STATE" ] || [ -n "$SPORT_TOKEN" ]; then
            python sport_bot.py --check-token || status=$?
          fi
          if [ "$status" = "0" ] && [ -n "$SPORT_TOKEN" ]; then
            echo "browser=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "3" ] || [ -z "$SPORT_TOKEN" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
            if [ "$EVENT_NAME" = "push" ] && [ -z "$SPORT_BROWSER_STATE" ]; then
              ready=false
              echo "Unit tests passed. The saved token needs renewal, but the initial trusted session is not configured; live login was skipped. Complete first-time authentication and run this workflow manually." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            exit "$status"
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Identify encrypted session cache
        id: cache
        if: steps.session.outputs.ready == 'true' && steps.session.outputs.browser == 'true'
        env:
          SPORT_BROWSER_STATE: ${{ secrets.SPORT_BROWSER_STATE }}
        run: |
          python - <<'PY'
          import os
          from session_cache import cache_scope
          seed = os.getenv('SPORT_BROWSER_STATE', '')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'configured={str(bool(seed)).lower()}\n')
              output.write(f'scope={cache_scope(seed) if seed else "none"}\n')
          PY
      - uses: actions/cache/restore@v4
        if: steps.cache.outputs.configured == 'true'
        with:
          path: .local/cloud-session.enc
          key: school-session-v1-${{ runner.os }}-${{ steps.cache.outputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: school-session-v1-${{ runner.os }}-${{ steps.cache.outputs.scope }}-
      - name: Install browser dependencies when needed
        if: steps.session.outputs.ready == 'true' && steps.session.outputs.browser == 'true'
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium
        if: steps.session.outputs.ready == 'true' && steps.session.outputs.browser == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Verify one login without attendance
        if: steps.session.outputs.ready == 'true'
        env:
          SPORT_USER: ${{ secrets.SPORT_USER }}
          SPORT_TOKEN: ${{ secrets.SPORT_TOKEN }}
          SPORT_PASSWORD: ${{ secrets.SPORT_PASSWORD }}
          SPORT_BROWSER_STATE: ${{ secrets.SPORT_BROWSER_STATE }}
          SPORT_SESSION_CACHE: .local/cloud-session.enc
          PYTHONUNBUFFERED: "1"
        run: python sport_bot.py --auth-only
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.configured == 'true' && hashFiles('.local/cloud-session.updated') != ''
        with:
          path: .local/cloud-session.enc
          key: school-session-v1-${{ runner.os }}-${{ steps.cache.outputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
