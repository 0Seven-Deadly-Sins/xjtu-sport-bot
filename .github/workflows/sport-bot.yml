name: XJTU Sport Bot

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      mode:
        description: "verify-login 只验证登录；run 执行签到及 31 分钟后的签退"
        type: choice
        default: verify-login
        options:
          - verify-login
          - run

permissions:
  contents: read

concurrency:
  group: sport-bot
  cancel-in-progress: false

jobs:
  attendance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Choose authentication method
        id: auth
        env:
          SPORT_TOKEN: ${{ secrets.SPORT_TOKEN }}
        run: |
          if [ -n "$SPORT_TOKEN" ]; then
            echo "browser=false" >> "$GITHUB_OUTPUT"
          else
            echo "browser=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install browser dependencies when needed
        if: steps.auth.outputs.browser == 'true'
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium
        if: steps.auth.outputs.browser == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Authenticate or run attendance
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'run' || inputs.mode || 'verify-login' }}
          SPORT_TOKEN: ${{ secrets.SPORT_TOKEN }}
          SPORT_USER: ${{ secrets.SPORT_USER }}
          SPORT_PASSWORD: ${{ secrets.SPORT_PASSWORD }}
          SPORT_BROWSER_STATE: ${{ secrets.SPORT_BROWSER_STATE }}
          SPORT_LONGITUDE: ${{ vars.SPORT_LONGITUDE }}
          SPORT_LATITUDE: ${{ vars.SPORT_LATITUDE }}
          SPORT_SEND_EMAIL: ${{ vars.SPORT_SEND_EMAIL }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "$RUN_MODE" = "run" ]; then
            python sport_bot.py
          else
            python sport_bot.py --auth-only
          fi
