name: XJTU Sport Bot

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sport-bot
  cancel-in-progress: false

jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SPORT_USER: ${{ secrets.SPORT_USER }}
      SPORT_PASSWORD: ${{ secrets.SPORT_PASSWORD }}
      SPORT_LONGITUDE: ${{ vars.SPORT_LONGITUDE }}
      SPORT_LATITUDE: ${{ vars.SPORT_LATITUDE }}
      SPORT_SEND_EMAIL: ${{ vars.SPORT_SEND_EMAIL }}
      SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run sport bot
        run: python sport_bot.py
